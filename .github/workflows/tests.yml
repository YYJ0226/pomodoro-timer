name: Settings regression tests

on:
  push:
    branches: [main, fix/atomic-duration-settings]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  settings:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python files
        run: python -m py_compile pomodoro.py tests/test_settings.py
      - name: Test settings callback without opening a window
        run: python -m unittest discover -s tests -v
